name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Code ophalen
        uses: actions/checkout@v4

      - name: .NET installeren
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build MyApi.Tests/MyApi.Tests.csproj

      # De endpoint-tests hebben de echte database nodig; die is er niet op GitHub.
      - name: Tests
        run: dotnet test MyApi.Tests/MyApi.Tests.csproj --no-build --filter "FullyQualifiedName!~EndpointTests"

      - name: Publish
        run: dotnet publish MyApi/MyApi.csproj -c Release -o publish

      - name: Zip uploaden
        uses: actions/upload-artifact@v4
        with:
          name: CargoHubAPI
          path: publish
